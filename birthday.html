<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生日快乐</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        body{
            background: linear-gradient(135deg, #ffd6e0, #fff7cc);
            height: 100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            font-family:"Microsoft Yahei",sans-serif;
        }
        .box{
            text-align:center;
            padding:40px 60px;
            background:rgba(255,255,255,0.6);
            border-radius:20px;
        }
        h1{
            color:#ff4777;
            font-size:48px;
            margin-bottom:20px;
        }
        p{
            font-size:22px;
            color:#444;
            margin:10px 0;
        }
        .wish{
            margin-top:25px;
            font-size:26px;
            color:#ff6688;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎂 生日快乐 🎂</h1>
        <p>愿平安喜乐，万事顺意</p>
        <p>岁岁无忧，闪闪发光</p>
        <p class="wish">新的一岁，所愿皆所得！</p>
    </div>
</body>
</html>
